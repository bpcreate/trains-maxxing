<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trains Maxxing — Stage</title>
<style>
  @font-face {
    font-family: 'Tag';
    src: url('/fonts/sedgwick-ave-display-latin-400-normal.woff2') format('woff2');
    font-display: block;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }
  body.idle { cursor: none; }
  #gl, #spray { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #spray { pointer-events: none; transition: opacity .6s; }
  #tag {
    position: fixed; left: 50%; top: 50%; max-width: 90vw; text-align: center;
    font: 400 14vw/0.95 'Tag', 'Marker Felt', 'Comic Sans MS', cursive;
    pointer-events: none; opacity: 0; white-space: pre-wrap; overflow-wrap: anywhere;
    -webkit-text-stroke: .12em #000; paint-order: stroke fill;
    text-shadow: .05em .06em 0 rgba(0,0,0,.85), 0 0 .35em currentColor;
    transform: translate(-50%, -50%) rotate(-6deg) scale(.6);
  }
  #tag.show { animation: tag 9s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes tag {
    0%   { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scale(.3); }
    6%   { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); }
    85%  { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.04); }
    100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.1); }
  }
  #panel {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 8, 12, .82); transition: opacity .4s; z-index: 5;
  }
  #panel.hidden { opacity: 0; pointer-events: none; }
  .card { display: flex; gap: 5vw; align-items: center; max-width: 90vw; }
  .card h1 { font: 400 clamp(40px, 7vw, 110px)/.9 'Tag', cursive; margin: 0 0 .3em; color: #ff2bd6; text-shadow: .04em .05em 0 #00e5ff; }
  .card ol { font-size: clamp(16px, 1.9vw, 30px); line-height: 1.5; padding-left: 1.2em; margin: 0 0 1em; }
  .card small { color: #9aa; font-size: clamp(12px, 1.1vw, 18px); line-height: 1.6; display: block; }
  .qr { background: #fff; padding: 1vw; border-radius: 1.2vw; text-align: center; color: #111; font-weight: 700; font-size: clamp(12px, 1.2vw, 20px); }
  .qr img { display: block; width: clamp(160px, 22vw, 380px); height: auto; }
  .qr.small img { width: clamp(90px, 10vw, 170px); }
  .qrs { display: flex; gap: 2vw; align-items: flex-end; }
  kbd { background: #333; border-radius: 4px; padding: 0 .4em; font: inherit; color: #fff; }
  #toast {
    position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); background: rgba(20, 20, 26, .92);
    padding: .7em 1.2em; border-radius: 999px; font-size: clamp(14px, 1.4vw, 22px); opacity: 0; transition: opacity .3s; z-index: 6;
  }
  #toast.show { opacity: 1; }
  #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 2vw; padding: 10vw; text-align: center; z-index: 9; background: #000; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="spray"></canvas>
<div id="tag"></div>
<div id="panel">
  <div class="card">
    <div>
      <h1 id="title">Trains Maxxing</h1>
      <ol>
        <li>Put your phone on the same Wi-Fi as this laptop</li>
        <li>Scan the big code with the phone camera</li>
        <li>Drag this window to the projector and press <kbd>F</kbd></li>
      </ol>
      <small><kbd>F</kbd> fullscreen &nbsp; <kbd>Q</kbd> show / hide this card &nbsp; <kbd>B</kbd> blackout<br>
      <span id="status">Connecting…</span></small>
    </div>
    <div class="qrs">
      <div class="qr"><img id="qr-remote" alt="Remote QR code">Phone remote</div>
      <div class="qr small"><img id="qr-kaleido" alt="Kaleidoscope QR code">iPad kaleidoscope</div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="fatal"></div>
<script type="module" src="stage.js"></script>
</body>
</html>
